# E2E suite against Vercel Preview Deployments.
#
# Vercel's GitHub integration reports each deployment through the Deployments
# API; when a Preview deployment goes green this workflow points Playwright at
# its URL (no build needed here — we test the real deployment). It can also be
# run by hand against any URL via workflow_dispatch.
#
# Preview Firebase currently points at production: this automated suite is
# public/read-only. Authenticated mutation tests require a separately approved,
# isolated environment and are never enabled by repository secrets/variables.

name: E2E

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployment URL to test against'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.deployment_status.environment_url || inputs.base_url }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.environment, 'review'))
    runs-on: ubuntu-24.04
    # Matches @playwright/test 1.56.0 in package-lock.json; includes browsers
    # and OS dependencies so runs do not depend on a live Ubuntu apt mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble@sha256:35246d87a7c88ea9b771c65d33171b2611b02a8253b4b12ce6f94376c55f99f2
    timeout-minutes: 30
    steps:
      - name: Checkout the deployed commit (matching tests)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright suite
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url }}
          E2E_ADMIN_EMAIL: ''
          E2E_ADMIN_PASSWORD: ''
          E2E_ALLOW_WRITES: '0'

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
